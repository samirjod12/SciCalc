name: Build SciCalc.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --name SciCalc --icon scicalc.ico --add-data "scicalc.ico;." scicalc.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SciCalc-windows
          path: dist/SciCalc.exe
